# Every rate, count and distribution the seed uses lives in this file (SPEC 14,
# A34/A35). All data is synthetic (A1); the PIN is a documented demo credential
# (A31). Run: `pnpm seed -- --seed 20261105 --as-of today`
#
# Syntax note (A34): this file uses a strict subset of YAML — # comments, one
# level of `section:` nesting, `key: value` scalars and comma-separated inline
# lists. The parser (scripts/seed/config.ts) rejects anything deeper, so a
# malformed rate fails the run before anything is written.

